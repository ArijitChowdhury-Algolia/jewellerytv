<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc">
<title id="title">JTV storefront and concierge workflow</title><desc id="desc">Protected Vercel access serves the React storefront and a validated API, which reads the catalogue and streams responses from existing agents. Local development uses the same handler.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#0076a9"/></marker></defs>
<rect width="1040" height="380" rx="12" fill="#f2f5f7"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#333"><text x="32" y="38" font-size="23" font-weight="bold">Storefront and concierge workflow</text><text x="32" y="64" font-size="14">Vercel authentication protects the hosted demo. Credentials stay on the server.</text></g>
<g fill="white" stroke="#0076a9" stroke-width="2"><rect x="32" y="115" width="245" height="130" rx="8"/><rect x="360" y="115" width="285" height="130" rx="8"/><rect x="730" y="94" width="277" height="75" rx="8"/><rect x="730" y="198" width="277" height="75" rx="8"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#333" text-anchor="middle"><text x="154" y="146" font-size="18" font-weight="bold">JTV React storefront</text><text x="154" y="173" font-size="14">InstantSearch, exact product pages</text><text x="154" y="196" font-size="14">Chat and shopping workspace</text><text x="154" y="220" font-size="13">Bounded context for each message</text><text x="502" y="146" font-size="18" font-weight="bold">Validated server API</text><text x="502" y="174" font-size="14">Allowed hosts, indices and operations</text><text x="502" y="198" font-size="14">Credentials and streaming transport</text><text x="502" y="221" font-size="13">Local Node server / Vercel function</text><text x="868" y="123" font-size="18" font-weight="bold">Algolia catalogue</text><text x="868" y="148" font-size="14">Read-only products, facets and sorts</text><text x="868" y="228" font-size="18" font-weight="bold">Hosted Agent Studio agents</text><text x="868" y="252" font-size="14">Concierge + optional brief extractor</text></g>
<g fill="none" stroke="#0076a9" stroke-width="2" marker-end="url(#arrow)"><path d="M277 178H357"/><path d="M645 152H684V131H727"/><path d="M645 209H683V235H727"/><path d="M868 273V316H154V248"/></g><text x="508" y="341" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="14" fill="#454545">Streamed answers and product cards return to the local shopping view</text></svg>
